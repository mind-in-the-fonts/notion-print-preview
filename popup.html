<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #eee;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-icon {
      width: 28px; height: 28px; border-radius: 7px;
      background: #e74c3c; color: #fff;
      display: grid; place-items: center;
      font-size: 14px; font-weight: 700;
    }
    .brand h1 { font-size: 14px; font-weight: 700; }
    .switch { position: relative; width: 40px; height: 22px; flex: none; cursor: pointer; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: #d8d3c8; border-radius: 999px;
      transition: background .2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 16px; width: 16px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s;
    }
    .switch input:checked + .slider { background: #e74c3c; }
    .switch input:checked + .slider::before { transform: translateX(18px); }

    main { padding: 14px 16px; }
    main.disabled { opacity: .45; pointer-events: none; }

    .step { margin-bottom: 12px; }
    .step-num {
      display: inline-block; width: 18px; height: 18px; border-radius: 50%;
      background: #e74c3c; color: #fff; text-align: center;
      font-size: 11px; font-weight: 700; line-height: 18px;
      margin-right: 4px;
    }
    .step-text { font-size: 12.5px; color: #555; }
    .step-desc { font-size: 11px; color: #999; margin-top: 4px; margin-left: 22px; line-height: 1.4; }

    .mark-btn {
      display: block; width: 100%; padding: 10px; font-size: 13px; font-weight: 600;
      border: 2px dashed #e74c3c; border-radius: 8px; cursor: pointer;
      background: #fdf0ef; color: #e74c3c; transition: all .15s;
      margin-top: 6px;
    }
    .mark-btn:hover { background: #fbe4e1; }

    .status {
      font-size: 12px; font-weight: 600; color: #e74c3c;
      min-height: 18px; margin-top: 10px;
    }

    .adjust { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; }
    .adjust.show { display: block; }
    .adjust-label { font-size: 11.5px; color: #999; margin-bottom: 6px; }
    .adjust-row { display: flex; align-items: center; gap: 6px; }
    .adj-btn {
      width: 32px; height: 28px; font-size: 14px; font-weight: 700;
      border: 1px solid #ddd; border-radius: 6px; cursor: pointer;
      background: #f8f8f8; color: #555; transition: all .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .adj-btn:hover { background: #eee; border-color: #ccc; }
    .adj-btn:active { background: #e0e0e0; }
    .adjust-info { font-size: 11px; color: #aaa; margin-left: 4px; }

    footer {
      padding: 10px 16px 12px;
      border-top: 1px solid #eee;
      font-size: 11px; color: #aaa;
      display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #c5cf6a; flex: none; }
    .dot.off { background: #d8d3c8; }

    .unsupported {
      padding: 24px 20px; text-align: center;
    }
    .unsupported h2 { font-size: 14px; font-weight: 650; margin-bottom: 8px; }
    .unsupported p { font-size: 12.5px; color: #999; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="supported" style="display:none">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">P</div>
        <h1>Print Preview</h1>
      </div>
      <label class="switch" title="미리보기 켜기/끄기">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>
    <main id="main">
      <div class="step">
        <span class="step-num">1</span>
        <span class="step-text">Cmd+P 로 1페이지 마지막 내용 확인</span>
      </div>
      <div class="step">
        <span class="step-num">2</span>
        <span class="step-text">아래 버튼을 누르고 그 위치를 클릭</span>
        <div class="step-desc">클릭한 위치가 1페이지 끝이 됩니다.<br>나머지 페이지는 자동으로 계산됩니다.</div>
      </div>
      <button id="markBtn" class="mark-btn">클릭으로 위치 지정</button>
      <div id="status" class="status"></div>
      <div id="adjust" class="adjust">
        <div class="adjust-label">미세 조정</div>
        <div class="adjust-row">
          <button class="adj-btn" id="upBig" title="크게 위로">&#x25B2;</button>
          <button class="adj-btn" id="upSmall" title="조금 위로">&#x25B5;</button>
          <button class="adj-btn" id="downSmall" title="조금 아래로">&#x25BF;</button>
          <button class="adj-btn" id="downBig" title="크게 아래로">&#x25BC;</button>
          <span class="adjust-info" id="adjustInfo"></span>
        </div>
      </div>
    </main>
    <footer>
      <span class="dot" id="dot"></span>
      <span id="footerText">Notion 페이지에서 사용하세요</span>
    </footer>
  </div>

  <div id="unsupported" class="unsupported" style="display:none">
    <h2>Notion 페이지가 아니에요</h2>
    <p>Notion 페이지에서 이 확장을 열어주세요.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
